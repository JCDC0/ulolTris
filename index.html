<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#07070d">
    <meta name="description" content="ulolTris, a cozy block stacker with pixel art scenes.">
    <title>ulolTris</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- PIXEL ART BACKGROUND -->
    <div id="bg-layer">
        <canvas id="bg-canvas"></canvas>
        <div id="bg-shade"></div>
    </div>

    <!-- MENU OVERLAY CONTAINER -->
    <div id="menu-container"></div>

    <!-- GAME AREA (hidden until a mode is selected) -->
    <div id="game-container" class="game-hidden">
        <div id="playfield" class="playfield">
            <div class="side side-left">
                <div class="box hold-box">
                    <div class="box-label">HOLD</div>
                    <canvas id="hold-canvas"></canvas>
                </div>
                <div id="hud-feed" class="hud-feed"></div>
                <div id="hud-stats" class="hud-stats"></div>
            </div>

            <div class="board-column">
                <canvas id="board-canvas"></canvas>
                <div id="hud-under" class="hud-under"></div>
            </div>

            <div class="meter"><div id="hud-meter-fill" class="meter-fill"></div></div>

            <div class="side side-right">
                <div class="box next-box">
                    <div class="box-label">NEXT</div>
                    <canvas id="next-canvas"></canvas>
                </div>
                <div id="hud-finesse" class="hud-finesse"></div>
            </div>
        </div>
    </div>

    <!-- TOUCH CONTROLS (phones and tablets; each button stands for a key) -->
    <div id="touch-controls" class="touch-controls">
        <div class="touch-cluster">
            <button type="button" class="touch-btn" data-key="ArrowLeft" aria-label="Move left">&#x25C0;</button>
            <button type="button" class="touch-btn" data-key="ArrowRight" aria-label="Move right">&#x25B6;</button>
            <button type="button" class="touch-btn touch-wide" data-key="ArrowDown" aria-label="Soft drop">&#x25BC;</button>
        </div>
        <div class="touch-cluster">
            <button type="button" class="touch-btn" data-key="KeyZ" aria-label="Rotate left">&#x21BA;</button>
            <button type="button" class="touch-btn" data-key="ArrowUp" aria-label="Rotate right">&#x21BB;</button>
            <button type="button" class="touch-btn touch-text" data-key="KeyC" aria-label="Hold">HOLD</button>
            <button type="button" class="touch-btn touch-text touch-drop" data-key="Space" aria-label="Hard drop">DROP</button>
        </div>
    </div>
    <button id="touch-pause" class="touch-pause" type="button" data-key="Escape" aria-label="Pause">&#x275A;&#x275A;</button>

    <!-- SETTINGS BUTTON (opens the settings menu; pauses a running game first) -->
    <button id="settings-toggle" class="settings-toggle" type="button" aria-label="Open settings">&#x2699;</button>

    <!-- MUSIC PLAYER -->
    <button id="music-toggle" class="music-toggle" type="button" aria-label="Toggle music player">&#x266B;</button>
    <div id="music-player-container"></div>

    <script src="game.js"></script>
</body>
</html>
