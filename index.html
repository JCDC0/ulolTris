<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ulolTris</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- PIXEL ART BACKGROUND -->
    <div id="bg-layer">
        <canvas id="bg-canvas"></canvas>
        <div id="bg-shade"></div>
    </div>

    <!-- MENU OVERLAY CONTAINER -->
    <div id="menu-container"></div>

    <!-- GAME AREA (hidden until a mode is selected) -->
    <div id="game-container" class="game-hidden">
        <div id="playfield" class="playfield">
            <div class="side side-left">
                <div class="box hold-box">
                    <div class="box-label">HOLD</div>
                    <canvas id="hold-canvas"></canvas>
                </div>
                <div id="hud-feed" class="hud-feed"></div>
                <div id="hud-stats" class="hud-stats"></div>
            </div>

            <div class="board-column">
                <canvas id="board-canvas"></canvas>
                <div id="hud-under" class="hud-under"></div>
            </div>

            <div class="meter"><div id="hud-meter-fill" class="meter-fill"></div></div>

            <div class="side side-right">
                <div class="box next-box">
                    <div class="box-label">NEXT</div>
                    <canvas id="next-canvas"></canvas>
                </div>
                <div id="hud-finesse" class="hud-finesse"></div>
            </div>
        </div>
    </div>

    <!-- SETTINGS PANEL -->
    <button id="settings-toggle" class="settings-toggle" type="button" aria-label="Open settings">&#x2699;</button>
    <div id="settings-panel" class="settings-panel" aria-hidden="true">
        <div class="settings-panel-header">
            <h3>SETTINGS</h3>
            <button id="settings-close" type="button" class="settings-close" aria-label="Close settings">&#x00D7;</button>
        </div>
        <div class="settings-tabs"></div>
        <div class="settings-tab-content"></div>
    </div>

    <!-- MUSIC PLAYER -->
    <button id="music-toggle" class="music-toggle" type="button" aria-label="Toggle music player">&#x266B;</button>
    <div id="music-player-container"></div>

    <script src="game.js"></script>
</body>
</html>
